<!-- Favicon: blue mac-style folder, inline SVG so no extra request -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 52'><path d='M4 8 Q4 4 8 4 L22 4 L26 8 L56 8 Q60 8 60 12 L60 18 L4 18 Z' fill='%231c7fc7'/><path d='M4 14 Q4 10 8 10 L56 10 Q60 10 60 14 L60 46 Q60 50 56 50 L8 50 Q4 50 4 46 Z' fill='%234ab8f0'/></svg>" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root[data-theme="light"] {
    --bg: #f4f2ed;
    --bg-2: #ebe8df;
    --paper: #ffffff;
    --ink-1: #15171a;
    --ink-2: #44464a;
    --ink-3: #8c8d8f;
    --ink-4: #c8c5bd;
    --line: #d2cec3;
    --line-soft: #e6e2d8;
    --accent: #1c7fc7;
    --accent-soft: rgba(28, 127, 199, 0.10);
    --folder-tab: #1c7fc7;
    --folder-body: #4ab8f0;
    --shadow: 0 1px 0 rgba(0,0,0,0.04), 0 22px 60px -28px rgba(20, 30, 50, 0.18);
  }
  :root[data-theme="dark"] {
    --bg: #0e1014;
    --bg-2: #15181d;
    --paper: #1a1d22;
    --ink-1: #f0eee8;
    --ink-2: #b8b6af;
    --ink-3: #7a7b7e;
    --ink-4: #3a3c40;
    --line: #2a2d33;
    --line-soft: #1f2228;
    --accent: #4aa8ee;
    --accent-soft: rgba(74, 168, 238, 0.14);
    --folder-tab: #1c7fc7;
    --folder-body: #4ab8f0;
    --shadow: 0 1px 0 rgba(0,0,0,0.3), 0 22px 60px -28px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink-1);
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }

  .app {
    max-width: 1500px;
    margin: 0 auto;
    padding: 36px 28px 60px;
  }

  /* ---------- masthead ---------- */
  .masthead { margin-bottom: 36px; }
  .masthead-inner {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 32px;
    align-items: end;
  }
  .name-block h1 {
    font-size: clamp(40px, 6vw, 64px);
    font-weight: 700;
    letter-spacing: -0.025em;
    margin: 0 0 6px;
    line-height: 0.95;
  }
  .name-block .sub {
    margin: 0;
    font-size: 15px;
    color: var(--ink-2);
    max-width: 56ch;
    text-wrap: balance;
  }
  /* keep each half of the tagline intact — break only at the separator */
  .name-block .sub .np { white-space: nowrap; }
  .contact {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 22px;
  }
  .c-link {
    display: flex;
    flex-direction: column;
    color: var(--ink-1) !important;
    text-decoration: none !important;
    padding: 4px 0;
  }
  .c-link:hover .c-value { color: var(--accent); }
  .c-label {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-3);
  }
  .c-value {
    font-size: 13.5px;
    color: var(--ink-1);
    transition: color 120ms ease;
  }

  /* ---------- window ---------- */
  .window {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    min-height: 640px;
  }
  .window-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-2);
  }
  .path-display {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    color: var(--ink-2);
  }
  .path-segment.dim { color: var(--ink-3); }
  .path-segment.active { color: var(--ink-1); }
  .path-display .sep { color: var(--ink-4); }

  .search-box {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 8px;
    color: var(--ink-3);
    min-width: 200px;
  }
  .search-box input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    font: inherit;
    color: var(--ink-1);
    font-size: 12.5px;
  }
  .search-box .clear {
    background: none; border: none; cursor: pointer; color: var(--ink-3);
    font-size: 16px; line-height: 1; padding: 0 2px;
  }
  .search-box .clear:hover { color: var(--ink-1); }

  .window-body {
    display: grid;
    grid-template-columns: 320px 1fr;
    flex: 1;
    min-height: 0;
  }

  /* ---------- tree ---------- */
  .tree {
    border-right: 1px solid var(--line);
    background: var(--bg-2);
    padding: 8px 0;
    overflow-y: auto;
    max-height: 720px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    color: var(--ink-1);
    padding-right: 14px;
    position: relative;
  }
  .row:hover { background: var(--line-soft); }
  .row[data-selected="true"] {
    background: var(--accent);
    color: white;
  }
  .row[data-selected="true"] .name { color: white; }
  .row[data-selected="true"] .chev { color: white; }
  .chev { color: var(--ink-3); width: 12px; display: inline-flex; }
  .row .icon { display: inline-flex; align-items: center; }
  .row .name {
    font-size: 13.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row .ext-link {
    margin-left: auto;
    color: var(--ink-3);
    display: inline-flex;
  }
  .row[data-selected="true"] .ext-link { color: rgba(255,255,255,0.85); }

  .app[data-density="compact"] .row { font-size: 12.5px; }
  .app[data-density="compact"] .row .name { font-size: 12.5px; }

  /* ---------- preview ---------- */
  .preview {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow-y: auto;
    max-height: 720px;
  }
  .preview-header {
    padding: 22px 28px 18px;
    border-bottom: 1px solid var(--line-soft);
  }
  .breadcrumb {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--ink-3);
    text-transform: lowercase;
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .breadcrumb .root { color: var(--ink-3); }
  .breadcrumb .current { color: var(--ink-1); }
  .breadcrumb .sep { color: var(--ink-4); }

  .preview-title-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .preview-icon-lg { display: inline-flex; }
  .preview-title {
    margin: 0;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.015em;
  }
  .preview-tagline {
    margin: 4px 0 0;
    color: var(--ink-2);
    font-size: 15px;
  }

  .preview-body {
    padding: 22px 28px 32px;
  }

  /* folder grid */
  .folder-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }
  .grid-item {
    padding: 18px 14px;
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    text-align: center;
    background: var(--paper);
    transition: all 140ms ease;
    cursor: pointer;
    font-family: inherit;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .grid-item:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 6px 20px -10px var(--accent-soft);
  }
  .grid-item:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .grid-icon { margin-bottom: 10px; display: flex; justify-content: center; }
  .grid-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-1);
    margin-bottom: 4px;
    word-break: break-word;
  }
  .grid-sub {
    font-size: 11.5px;
    color: var(--ink-3);
    line-height: 1.4;
  }

  /* status bar */
  .status-bar {
    border-top: 1px solid var(--line);
    background: var(--bg-2);
    padding: 7px 16px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--ink-2);
    display: flex;
    justify-content: space-between;
  }
  .status-bar .dim { color: var(--ink-3); }

  .small { font-size: 12.5px; }

  /* ---------- graphical tree (legacy, unused) ---------- */
  .tg-stage {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 32px 20px;
    box-shadow: var(--shadow);
    background-image: radial-gradient(circle, var(--line-soft) 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: 0 0;
    position: relative;
  }
  .tg-stage::-webkit-scrollbar { height: 10px; }
  .tg-stage::-webkit-scrollbar-track { background: transparent; }
  .tg-stage::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
  .tg-stage::-webkit-scrollbar-thumb:hover { background: var(--ink-4); }
  .tg-inner {
    width: max-content;
    margin: 0 auto;
    min-width: 100%;
  }
  :root[data-theme="dark"] .tg-stage {
    background-image: radial-gradient(circle, #232730 1px, transparent 1px);
  }
  .tg-list {
    list-style: none;
    margin: 0;
    padding: 0;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .tg-list-root {
    min-width: max-content;
  }
  .tg-li {
    list-style: none;
    position: relative;
    padding: 24px 6px 0;
    text-align: center;
    flex: 0 0 auto;
  }

  /* horizontal connector segments (top of each li) */
  .tg-list .tg-li::before,
  .tg-list .tg-li::after {
    content: '';
    position: absolute;
    top: 0;
    right: 50%;
    width: 50%;
    height: 24px;
    border-top: 1.5px solid var(--line);
  }
  .tg-list .tg-li::after {
    right: auto;
    left: 50%;
    border-left: 1.5px solid var(--line);
  }
  /* hide top connectors for the root li (no parent above) */
  .tg-list-root > .tg-li::before,
  .tg-list-root > .tg-li::after {
    display: none;
  }
  /* corner caps for first/last children */
  .tg-list .tg-li:first-child::before {
    border-top: none;
  }
  .tg-list .tg-li:last-child::after {
    border-top: none;
  }
  .tg-list .tg-li:last-child::before {
    border-right: 1.5px solid var(--line);
    border-radius: 0 6px 0 0;
  }
  .tg-list .tg-li:first-child::after {
    border-radius: 6px 0 0 0;
  }
  /* only child — straight line, no T */
  .tg-list .tg-li:only-child::before,
  .tg-list .tg-li:only-child::after {
    display: none;
  }
  .tg-list .tg-li:only-child {
    padding-top: 24px;
  }
  /* draw the connecting vertical for an only-child li — but NOT for the root li (it has no parent) */
  .tg-list:not(.tg-list-root) .tg-li:only-child > .tg-node::before {
    content: '';
    position: absolute;
    top: -24px;
    left: 50%;
    height: 24px;
    width: 1.5px;
    background: var(--line);
    margin-left: -0.75px;
  }
  /* root li — no top padding, no incoming line */
  .tg-list-root > .tg-li {
    padding-top: 0;
  }
  /* connector going down from a node to its children's horizontal bar */
  .tg-li > .tg-list::before {
    content: '';
    position: absolute;
    top: -24px;
    left: 50%;
    height: 24px;
    width: 1.5px;
    background: var(--line);
    margin-left: -0.75px;
  }

  /* nodes */
  .tg-node {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    transition: background 140ms ease, transform 140ms ease;
    min-width: 84px;
    position: relative;
  }
  .tg-node:hover {
    background: var(--bg-2);
    transform: translateY(-1px);
  }
  .tg-node[data-open="true"] {
    background: var(--accent-soft);
  }
  .tg-node.root {
    background: transparent;
    cursor: default;
    padding: 8px 14px;
    margin-bottom: 24px;
  }
  .tg-node.root .tg-label {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-1);
  }
  /* the downward connector from root to its children starts BELOW the root node, not inside it */
  .tg-list-root > .tg-li > .tg-list::before {
    top: 0;
    height: 24px;
    margin-top: -24px;
  }
  .tg-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .tg-label {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-1);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    white-space: nowrap;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tg-count {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ---------- modal ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 18, 24, 0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    animation: fadeIn 160ms ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .modal-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 24px 80px -20px rgba(0,0,0,0.4);
    width: min(820px, 100%);
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: slideUp 220ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .modal-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 18px 22px;
    border-bottom: 1px solid var(--line-soft);
    gap: 16px;
  }
  .modal-title-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .modal-icon { display: inline-flex; }
  .modal-title {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .modal-tagline {
    margin: 2px 0 0;
    color: var(--ink-3);
    font-size: 13px;
  }
  .modal-close {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-2);
    width: 28px;
    height: 28px;
    border-radius: 6px;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    transition: all 120ms ease;
    flex-shrink: 0;
  }
  .modal-close:hover {
    background: var(--bg-2);
    color: var(--ink-1);
    border-color: var(--ink-4);
  }
  .modal-body {
    padding: 22px 26px 26px;
    overflow-y: auto;
  }

  /* markdown / preview content (shared between modal + folder views) */
  .md h1 { font-size: 22px; margin: 0 0 14px; font-weight: 600; letter-spacing: -0.01em; }
  .md h2 { font-size: 16px; margin: 22px 0 8px; font-weight: 600; }
  .md p { margin: 0 0 12px; color: var(--ink-2); max-width: 64ch; line-height: 1.6; }
  .md ul { margin: 0 0 14px; padding-left: 18px; color: var(--ink-2); }
  .md li { margin-bottom: 6px; line-height: 1.55; }
  .md strong { color: var(--ink-1); font-weight: 600; }
  .md code {
    background: var(--bg-2);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12.5px;
    color: var(--ink-1);
  }
  .plain {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
    background: var(--bg-2);
    padding: 18px 20px;
    border-radius: 6px;
    color: var(--ink-2);
    line-height: 1.6;
    white-space: pre-wrap;
    margin: 0;
  }
  .project .desc {
    color: var(--ink-2);
    max-width: 64ch;
    line-height: 1.6;
    margin: 0 0 18px;
    white-space: pre-line;
  }
  .stack { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
  .chip {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px;
    padding: 3px 8px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--ink-2);
  }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    border-radius: 6px;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    text-decoration: none !important;
    transition: all 120ms ease;
    font-family: inherit;
  }
  .btn.primary { background: var(--accent); color: white !important; }
  .btn.primary:hover { filter: brightness(0.92); }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--ink-1) !important; }
  .btn.ghost:hover { background: var(--bg-2); border-color: var(--ink-4); }

  .doc-preview .doc-frame {
    width: 100%;
    height: 480px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--paper);
    margin-bottom: 16px;
  }
  /* Design canvases are wide + tall — give them more room and let the iframe scroll internally */
  .doc-preview .doc-frame.design-live { height: 660px; }
  .placeholder {
    height: 240px;
    border: 1px dashed var(--ink-4);
    border-radius: 6px;
    position: relative;
    overflow: hidden;
    margin-bottom: 16px;
    background: var(--bg-2);
  }
  .placeholder.video { height: 320px; }
  .placeholder-stripes {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      45deg,
      transparent 0,
      transparent 12px,
      var(--line-soft) 12px,
      var(--line-soft) 13px
    );
  }
  .placeholder-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11.5px;
    color: var(--ink-3);
    text-transform: lowercase;
  }
  .video-wrap {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    margin-bottom: 16px;
  }
  .video-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 6px;
  }

  /* design thumbnail (Claude pages / image exports that can't be iframed) */
  .design-thumb {
    display: block;
    position: relative;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 16px;
    background: var(--bg-2);
    transition: border-color 120ms ease;
  }
  .design-thumb:hover { border-color: var(--accent); }
  .design-thumb img { display: block; width: 100%; height: auto; }
  .design-thumb-badge {
    position: absolute;
    right: 10px;
    bottom: 10px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border-radius: 5px;
    background: rgba(0, 0, 0, 0.72);
    color: #fff;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px;
    opacity: 0;
